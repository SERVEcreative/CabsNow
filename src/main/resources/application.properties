spring.application.name=CabsNow

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
jwt.secret=${JWT_SECRET:CabsNowDevSecretKeyMustBeAtLeast256BitsLong!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# GraphHopper
graphhopper.api.key=${GRAPHHOPPER_API_KEY:}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cache
spring.cache.type=simple

# Redis (optional — set REDIS_ENABLED=true in docker)
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail (optional — logs only when disabled)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Rate limiting
app.rate-limit.requests-per-minute=${RATE_LIMIT:60}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ride matching
app.ride.match-radius-km=${RIDE_MATCH_RADIUS_KM:10}

# Kafka (optional — set KAFKA_ENABLED=true in docker)
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Actuator & metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

app.admin.email=${ADMIN_EMAIL:admin@cabsnow.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
